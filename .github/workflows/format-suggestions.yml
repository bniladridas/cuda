name: Format Suggestions

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: format-suggestions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  suggest:
    if: github.event_name == 'pull_request_target' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned formatters
        run: python -m pip install --disable-pip-version-check --quiet clang-format==22.1.8 ruff==0.17.5

      - name: Post inline formatter suggestions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python format-repair/engine/format_suggestions.py
