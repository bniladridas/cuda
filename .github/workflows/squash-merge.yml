name: squash-merge

on:
  pull_request_target:
    types: [labeled]

concurrency:
  group: squash-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  squash:
    name: squash-merge
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'squash-merge:approved'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    steps:
      - name: Check out trusted default-branch policy and code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate approval and attempt squash merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPROVER: ${{ github.actor }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 squash-merge/engine/merge_gate.py \
            --repo "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --actor "$APPROVER" \
            --event-head "$EVENT_HEAD_SHA" \
            --target-branch "$DEFAULT_BRANCH" \
            --config .github/squash-merge.json
