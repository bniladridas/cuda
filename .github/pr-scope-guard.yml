version: 1

# The scope keys must match .github/pr-scopes.json exactly. A file can match
# more than one scope: a tool workflow is also CI, and a tool guide is also
# docs. Keep both files in step when a scope is added.
ignore:
  - "LICENSE"
scopes:
  automation:
    - ".github/actionlint.yaml"
    - ".github/CODEOWNERS"
    - ".github/pr-scopes.json"
    - ".yamllint.yml"
    - ".gitignore"
    - "gitbook-docs.yaml"
    - "runners/**"
    - "format-repair/**"
    - ".github/format-repair.yml"
    - ".github/workflows/format-repair.yml"
    - ".github/workflows/format-suggestions.yml"
    - "docs/format-repair.md"
    - "README.md"
    - ".github/CONTRIBUTING.md"
    - ".github/pr-scope-guard.yml"
    - ".github/workflows/ci.yml"
  format-repair:
    - "format-repair/**"
    - ".github/format-repair.yml"
    - ".github/workflows/format-repair.yml"
    - ".github/workflows/format-suggestions.yml"
    - "docs/format-repair.md"
    - "README.md"
    - ".github/CONTRIBUTING.md"
    - ".github/pr-scope-guard.yml"
    - ".github/workflows/ci.yml"
    - ".github/pr-scopes.json"
  benchmarks:
    - "benchmarks/**"
  build:
    - "CMakeLists.txt"
    - "cmake/**"
    - "**/CMakeLists.txt"
  ci:
    - ".github/workflows/**"
  codex-review:
    - ".github/codex-review.json"
    - ".github/workflows/codex-review.yml"
    - "docs/codex-review.md"
  docs:
    - "docs/**"
    - "README.md"
    - ".github/CONTRIBUTING.md"
    - ".github/PULL_REQUEST_TEMPLATE.md"
  issue-landing:
    - "issue-landing/**"
    - ".github/workflows/issue-landing.yml"
    - "docs/issue-landing.md"
  kernels:
    - "src/**"
    - "include/**"
    - "kernels/**"
  label-review:
    - "label-review/**"
    - ".github/label-review.yml"
    - ".github/workflows/label-review.yml"
    - ".github/workflows/label-review-caller.yml"
    - "docs/label-review.md"
  pr-confidence:
    - "pr-confidence/**"
    - ".github/pr-confidence.yml"
    - ".github/workflows/pr-confidence.yml"
    - "docs/pr-confidence.md"
  pr-scope-guard:
    - ".github/pr-scopes.json"
    - "pr-scope-guard/**"
    - ".github/pr-scope-guard.yml"
    - ".github/workflows/pr-scope-guard.yml"
    - "docs/pr-scope-guard.md"
  pr-title:
    - "pr-title/**"
    - ".github/workflows/pr-title-assistant.yml"
    - "docs/pr-title-assistant.md"
  rebase-agent:
    - "rebase-agent/**"
    - "docs/rebase-agent.md"
  squash-merge:
    - "squash-merge/**"
    - ".github/squash-merge.json"
    - ".github/workflows/squash-merge.yml"
    - "docs/squash-merge.md"
  tests:
    - "tests/**"
