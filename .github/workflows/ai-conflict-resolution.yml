name: AI-assisted conflict resolution

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-conflict-resolution-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event.action == 'labeled' && github.event.label.name == 'conflict:resolve'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_ref: ${{ steps.gate.outputs.head_ref }}
      old_head: ${{ steps.gate.outputs.old_head }}
      base_ref: ${{ steps.gate.outputs.base_ref }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify maintainer authorization and exact PR state
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          jq -e --arg actor "$EVENT_ACTOR" \
            '.maintainers | index($actor) != null' .github/squash-merge.json >/dev/null
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > pr.json
          jq -e '
            .state == "open" and .merged == false and .draft == false and
            .head.repo.full_name == env.REPOSITORY and
            .base.repo.full_name == env.REPOSITORY and
            .head.sha == env.EVENT_HEAD_SHA and
            .head.ref == env.EVENT_HEAD_REF and
            .base.ref == env.EVENT_BASE_REF and .base.ref == "main"
          ' pr.json >/dev/null
          test "$EVENT_HEAD_REF" != "main"
          test "$EVENT_HEAD_REF" != "$EVENT_BASE_REF"
          git check-ref-format --branch "$EVENT_HEAD_REF"
          encoded_ref="$(jq -rn --arg ref "$EVENT_HEAD_REF" '$ref | @uri')"
          gh api "repos/$REPOSITORY/branches/$encoded_ref" > branch.json
          jq -e '.protected == false' branch.json >/dev/null
          BASE_SHA="$(gh api "repos/$REPOSITORY/git/ref/heads/$EVENT_BASE_REF" --jq '.object.sha')"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "head_ref=$EVENT_HEAD_REF"
            echo "old_head=$EVENT_HEAD_SHA"
            echo "base_ref=$EVENT_BASE_REF"
            echo "base_sha=$BASE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch exact PR and base revisions
        env:
          HEAD_REF: ${{ steps.gate.outputs.head_ref }}
          OLD_HEAD: ${{ steps.gate.outputs.old_head }}
          BASE_REF: ${{ steps.gate.outputs.base_ref }}
          BASE_SHA: ${{ steps.gate.outputs.base_sha }}
        run: |
          set -euo pipefail
          refs=(
            "refs/heads/$HEAD_REF:refs/remotes/origin/approved-pr"
            "refs/heads/$BASE_REF:refs/remotes/origin/approved-base"
          )
          git fetch --no-tags origin "${refs[@]}"
          test "$(git rev-parse refs/remotes/origin/approved-pr)" = "$OLD_HEAD"
          test "$(git rev-parse refs/remotes/origin/approved-base)" = "$BASE_SHA"
          git switch --detach "$OLD_HEAD"
          git config user.name "cuda-ai-conflict-resolver"
          git config user.email "cuda-ai-conflict-resolver@users.noreply.github.com"

      - name: Rebase and request bounded AI resolution only for conflicts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASE_SHA: ${{ steps.gate.outputs.base_sha }}
          OLD_HEAD: ${{ steps.gate.outputs.old_head }}
        run: |
          set -euo pipefail
          if ! git rebase "$BASE_SHA"; then
            if ! git rev-parse --verify -q REBASE_HEAD >/dev/null; then
              git rebase --abort || true
              echo "Rebase failed without a resolvable conflict state." >&2
              exit 1
            fi
            resolver_args=(--repo "$GITHUB_WORKSPACE" --report ai-conflict-report.json)
            python3 rebase-agent/engine/ai_conflict_resolver.py "${resolver_args[@]}"
          else
            printf '{"model":"not-needed","rounds":[],"resolved":true}\n' > ai-conflict-report.json
          fi
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check "$BASE_SHA...HEAD"
          git diff --binary --full-index "$BASE_SHA...HEAD" > resolved.patch
          git bundle create resolved.bundle HEAD
          {
            echo "## AI conflict resolution report"
            echo
            echo "- PR: #${{ github.event.pull_request.number }}"
            echo "- Original head: `$OLD_HEAD`"
            echo "- Base: `$BASE_SHA`"
            echo "- Result: `$(git rev-parse HEAD)`"
            echo "- Changed paths:"
            git diff --name-only "$BASE_SHA...HEAD" | sed 's/^/- /'
          } > resolution-summary.md
          python3 -m py_compile rebase-agent/engine/ai_conflict_resolver.py

      - name: Upload resolution bundle and review report
        uses: actions/upload-artifact@v4
        with:
          name: ai-conflict-resolution-${{ github.event.pull_request.number }}
          path: |
            resolved.bundle
            resolved.patch
            ai-conflict-report.json
            resolution-summary.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pr-repair-write
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Download reviewed resolution artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-conflict-resolution-${{ github.event.pull_request.number }}
          path: resolution

      - name: Verify live refs and publish with exact force-with-lease
        env:
          GH_TOKEN: ${{ secrets.PR_REBASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ needs.resolve.outputs.head_ref }}
          OLD_HEAD: ${{ needs.resolve.outputs.old_head }}
          BASE_REF: ${{ needs.resolve.outputs.base_ref }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || {
            echo "Configure PR_REBASE_TOKEN with contents write access." >&2
            exit 1
          }
          gh auth setup-git
          PR="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          jq -e '
            .state == "open" and .merged == false and .draft == false and
            .head.repo.full_name == env.REPOSITORY and
            .base.repo.full_name == env.REPOSITORY and
            .head.sha == env.OLD_HEAD and
            .head.ref == env.HEAD_REF and .base.ref == env.BASE_REF
          ' <<<"$PR" >/dev/null
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/$BASE_REF" --jq '.object.sha')" = "$BASE_SHA"
          git init publish
          git -C publish remote add origin "https://github.com/$REPOSITORY.git"
          refs=(
            "refs/heads/$HEAD_REF:refs/remotes/origin/approved-pr"
            "refs/heads/$BASE_REF:refs/remotes/origin/approved-base"
          )
          git -C publish fetch --no-tags origin "${refs[@]}"
          test "$(git -C publish rev-parse refs/remotes/origin/approved-pr)" = "$OLD_HEAD"
          test "$(git -C publish rev-parse refs/remotes/origin/approved-base)" = "$BASE_SHA"
          git -C publish fetch "$GITHUB_WORKSPACE/resolution/resolved.bundle" HEAD
          RESULT="$(git -C publish rev-parse FETCH_HEAD)"
          git -C publish merge-base --is-ancestor "$BASE_SHA" "$RESULT"
          LEASE="--force-with-lease=refs/heads/$HEAD_REF:$OLD_HEAD"
          git -C publish push "$LEASE" origin "$RESULT:refs/heads/$HEAD_REF"
          echo "Published AI-assisted rebase for PR #$PR_NUMBER at $RESULT."
          echo "The PR remains open and must pass normal CI and review."
