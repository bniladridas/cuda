name: PR label and milestone review
# Uses pull_request_target and never checks out or executes PR code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: number
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      proposal_hash: ${{ steps.hash.outputs.proposal_hash }}
    steps:
      - name: Create CUDA Actions token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CUDA_ACTIONS_APP_ID }}
          private-key: ${{ secrets.CUDA_ACTIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-issues: read
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build diff-grounded proposal
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: python3 label-review/engine/pr_review.py propose --pr "$PR_NUMBER"
      - name: Export proposal digest
        id: hash
        run: echo "proposal_hash=$(sha256sum pr-proposal.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
  comment:
    needs: propose
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Create CUDA Actions token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CUDA_ACTIONS_APP_ID }}
          private-key: ${{ secrets.CUDA_ACTIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-issues: write
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rebuild and verify proposal before commenting
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          EXPECTED_PROPOSAL_HASH: ${{ needs.propose.outputs.proposal_hash }}
        run: |
          python3 label-review/engine/pr_review.py propose --pr "$PR_NUMBER"
          actual="$(sha256sum pr-proposal.json | cut -d ' ' -f1)"
          test "$actual" = "$EXPECTED_PROPOSAL_HASH"
      - name: Post verified proposal
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: gh issue comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file pr-proposal.md
  apply:
    needs: [propose, comment]
    if: vars.PR_LABEL_REVIEW_APPLY == 'true'
    runs-on: ubuntu-latest
    environment: pr-label-review
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Create CUDA Actions token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CUDA_ACTIONS_APP_ID }}
          private-key: ${{ secrets.CUDA_ACTIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-issues: write
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rebuild and verify approved proposal
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          EXPECTED_PROPOSAL_HASH: ${{ needs.propose.outputs.proposal_hash }}
        run: |
          python3 label-review/engine/pr_review.py propose --pr "$PR_NUMBER"
          actual="$(sha256sum pr-proposal.json | cut -d ' ' -f1)"
          test "$actual" = "$EXPECTED_PROPOSAL_HASH"
      - name: Re-fetch and verify PR diff and metadata, then apply
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: python3 label-review/engine/pr_review.py apply --pr "$PR_NUMBER" --artifact pr-proposal.json
