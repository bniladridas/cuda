name: steward-pr-metadata

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Existing pull request number to apply Steward metadata to
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: steward-pr-metadata-${{ github.event.pull_request.number || inputs.pr-number || github.run_id }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event_name != 'workflow_dispatch'
      || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Apply metadata to Steward pull requests
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.eventName === 'workflow_dispatch'
              ? Number(core.getInput('pr-number'))
              : context.issue.number;

            if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
              throw new Error('A valid pull request number is required');
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.notice(`PR #${prNumber} is not open; no metadata changed.`);
              return;
            }

            const isStewardPr =
              (pr.title || '').startsWith('[steward]')
              || (pr.head.ref || '').startsWith('steward/');

            if (!isStewardPr) {
              core.notice(`PR #${prNumber} is not a Steward PR; no metadata changed.`);
              return;
            }

            // Add labels without replacing labels already applied by maintainers.
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['documentation', 'enhancement'],
            });

            // Only fill an empty milestone. Preserve an intentional assignment.
            const targetMilestone = 4;
            if (!pr.milestone) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                milestone: targetMilestone,
              });
              core.notice(`Assigned milestone #${targetMilestone} to PR #${prNumber}.`);
            } else if (pr.milestone.number !== targetMilestone) {
              core.warning(
                `PR #${prNumber} already has milestone #${pr.milestone.number}; ` +
                'preserving the existing assignment.'
              );
            } else {
              core.notice(`PR #${prNumber} already has the target milestone.`);
            }

            core.notice(`Applied Steward metadata to PR #${prNumber}.`);
