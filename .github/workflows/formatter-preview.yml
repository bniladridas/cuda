name: formatter-preview

on:
  push:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned formatter
        run: python3 -m pip install --disable-pip-version-check --quiet clang-format==22.1.8
      - name: Print exact formatter output
        run: |
          clang-format --version
          clang-format -i benchmarks/device_metadata.h benchmarks/main_bench.cpp tests/test_benchmark_metadata.cpp
          git diff -- benchmarks/device_metadata.h benchmarks/main_bench.cpp
          git diff -- tests/test_benchmark_metadata.cpp
