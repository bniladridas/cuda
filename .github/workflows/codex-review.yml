name: codex-review

on:
  pull_request_target:
    types: [labeled]

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  request-review:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'codex:review'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Post Codex review request
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const policy = JSON.parse(
              fs.readFileSync(".github/codex-review.json", "utf8")
            );
            const pr = context.payload.pull_request;
            const label = "codex:review";
            const actor = context.actor;
            const repo = `${context.repo.owner}/${context.repo.repo}`;

            if (!pr || pr.base?.repo?.full_name !== repo ||
                pr.head?.repo?.full_name !== repo) {
              core.setFailed("Only same-repository pull requests are eligible.");
              return;
            }
            if (!policy.maintainers.includes(actor) || actor.endsWith("[bot]")) {
              core.setFailed(`Unauthorized Codex review label actor: ${actor}`);
              return;
            }

            const marker = `<!-- codex-review-request:${pr.number}:${pr.head.sha} -->`;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, per_page: 100 }
            );
            const alreadyRequested = comments.some(comment =>
              comment.body?.includes(marker)
            );

            if (!alreadyRequested) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `@codex review\n\nRequested by @${actor} via the ${label} label.\n\n${marker}`
              });
              core.notice(
                "Posted @codex review command. Codex response is handled by " +
                "the connected GitHub integration."
              );
            } else {
              core.notice("A Codex review request already exists for this PR head.");
            }

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              name: label
            });
