name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Public commit SHA to use as the validation checkout base.
        required: true
        type: string
      result_sha:
        description: Exact rebased commit SHA contained in the resolver bundle.
        required: false
        type: string
        default: ""
      bundle_artifact:
        description: Artifact name containing the trusted resolver's Git bundle.
        required: false
        type: string
        default: ""
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Host-side checks. Runs on every push and PR on a standard GitHub-hosted
  # runner. No CUDA toolkit is installed, so the kernels are not compiled and
  # the GPU kernels are NOT verified here. This job proves the tree configures,
  # the host references are correct, C++ and CUDA sources are formatted, host
  # C++ passes clang-tidy, the CUDA test binaries are absent rather than
  # silently passing, the workflow and repository YAML pass actionlint and
  # yamllint, and the label-review, PR confidence, PR Scope Guard, formatting
  # repair, squash-merge, rebase safety, and CUDA Review engines pass their tests.
  # Python-only PR title and PR creation suites run in the separate Python job.
  cpu:
    runs-on: ubuntu-latest
    steps:
      - name: Download resolved Git bundle
        if: inputs.bundle_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.bundle_artifact }}
          path: ${{ runner.temp }}/resolved-bundle

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Restore and verify rebased tree
        if: inputs.bundle_artifact != ''
        env:
          EXPECTED_RESULT_SHA: ${{ inputs.result_sha }}
        run: |
          set -euo pipefail
          if ! command -v git >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git
          fi
          if [ ! -d .git ]; then
            git init
          fi
          git fetch "${RUNNER_TEMP}/resolved-bundle/resolved.bundle" HEAD
          ACTUAL_RESULT_SHA="$(git rev-parse FETCH_HEAD)"
          test "$ACTUAL_RESULT_SHA" = "$EXPECTED_RESULT_SHA"
          git checkout --detach "$ACTUAL_RESULT_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_RESULT_SHA"

      - name: Lint YAML
        run: |
          python3 -m pip install --disable-pip-version-check --quiet yamllint==1.38.0
          git ls-files -co --exclude-standard '*.yml' '*.yaml' | xargs yamllint

      - name: Lint GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: Test the label review engine
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml==6.0.2 jsonschema==4.23.0
          python3 -m unittest discover -s label-review/tests

      - name: Test GPU CI authorization policy
        run: python3 -m unittest discover -s gpu-ci-policy/tests

      - name: Test the issue landing engine
        run: python3 -m unittest discover -s issue-landing/tests

      - name: Test the PR confidence engine
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml==6.0.2
          python3 -m unittest discover -s pr-confidence/tests

      - name: Test the PR Scope Guard engine
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml==6.0.2 jsonschema==4.23.0
          python3 -m unittest discover -s pr-scope-guard/tests

      - name: Test the formatting repair engine
        run: python3 -m unittest discover -s format-repair/tests

      - name: Test the squash-merge policy engine
        run: python3 -m unittest discover -s squash-merge/tests

      - name: Test the safe rebase engine
        run: python3 -m unittest discover -s rebase-agent/tests

      - name: Test the separate merge integration engine
        run: python3 -m unittest discover -s rebase-agent/tests -p 'test_merge_agent.py'

      - name: Test GitHub API tree inspection
        run: python3 -m unittest discover -s rebase-agent/tests -p 'test_tree_inspector.py'

      - name: Test bounded repair agent
        run: python3 -m unittest discover -s rebase-agent/tests -p 'test_repair_agent.py'

      - name: Test CUDA Review publisher
        run: python3 -m unittest discover -s cuda-review/tests

      - name: Test runner skip handling
        run: bash tests/test_runner.sh

      - name: Configure (CPU only)
        run: |
          cmake -S . -B build-cpu \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_CUDAToolkit=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build-cpu -j"$(nproc)"

      - name: Test (host reference only)
        run: ctest --test-dir build-cpu --output-on-failure

      - name: Install C++ quality tools
        run: |
          python3 -m pip install --disable-pip-version-check --quiet \
            clang-format==22.1.8 clang-tidy==22.1.8

      - name: Check C++ and CUDA formatting
        run: |
          clang-format --version
          if ! git ls-files '*.cpp' '*.h' '*.cu' '*.cuh' | grep -q .; then
            echo "No C++ or CUDA files found" >&2
            exit 1
          fi
          git ls-files -z '*.cpp' '*.h' '*.cu' '*.cuh' |
            xargs -0 clang-format --dry-run --Werror

      - name: Static analysis (host C++ only)
        run: |
          test -f build-cpu/compile_commands.json
          clang-tidy --version
          clang-tidy --config-file=.clang-tidy --warnings-as-errors='*' \
            -p build-cpu tests/test_host.cpp

      - name: Assert GPU binaries were not built
        run: |
          if [ -e build-cpu/tests/test_vecadd ] || [ -e build-cpu/tests/test_reduce ]; then
            echo "CUDA test binaries exist in a CPU-only build" >&2
            exit 1
          fi
          echo "ok: no CUDA binaries in the CPU-only build"

  # Python quality. Ruff, every Python unittest suite present in the checkout,
  # and coverage. Coverage is reported without a pass threshold. No CUDA
  # toolkit or GPU is required.
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Download resolved Git bundle
        if: inputs.bundle_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.bundle_artifact }}
          path: ${{ runner.temp }}/resolved-bundle

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Restore and verify rebased tree
        if: inputs.bundle_artifact != ''
        env:
          EXPECTED_RESULT_SHA: ${{ inputs.result_sha }}
        run: |
          set -euo pipefail
          if ! command -v git >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git
          fi
          if [ ! -d .git ]; then
            git init
          fi
          git fetch "${RUNNER_TEMP}/resolved-bundle/resolved.bundle" HEAD
          ACTUAL_RESULT_SHA="$(git rev-parse FETCH_HEAD)"
          test "$ACTUAL_RESULT_SHA" = "$EXPECTED_RESULT_SHA"
          git checkout --detach "$ACTUAL_RESULT_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_RESULT_SHA"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Lint Python
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Test Python with coverage
        run: |
          set -euo pipefail
          coverage erase
          ran=0
          for suite in pr-confidence label-review pr-scope-guard pr-title \
            format-repair squash-merge rebase-agent benchmarks repository-steward pr-create; do
            if [ ! -d "$suite/tests" ]; then
              echo "Skipping $suite: tests directory not present"
              continue
            fi
            echo "Testing $suite"
            coverage run --append -m unittest discover -s "$suite/tests"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "No Python test suites found" >&2
            exit 1
          fi
          coverage report --show-missing --omit="*/tests/*,*/test_*.py"
          coverage xml -o coverage.xml --omit="*/tests/*,*/test_*.py"

      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: warn

  # Compile CUDA device code on a hosted runner without requiring an NVIDIA
  # device. This validates NVCC compilation only; no test binary is executed.
  cuda-compile:
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.6.3-devel-ubuntu22.04
    timeout-minutes: 30
    steps:
      - name: Download resolved Git bundle
        if: inputs.bundle_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.bundle_artifact }}
          path: ${{ runner.temp }}/resolved-bundle

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Restore and verify rebased tree
        if: inputs.bundle_artifact != ''
        env:
          EXPECTED_RESULT_SHA: ${{ inputs.result_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v git >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git
          fi
          if [ ! -d .git ]; then
            git init
          fi
          git fetch "${RUNNER_TEMP}/resolved-bundle/resolved.bundle" HEAD
          ACTUAL_RESULT_SHA="$(git rev-parse FETCH_HEAD)"
          test "$ACTUAL_RESULT_SHA" = "$EXPECTED_RESULT_SHA"
          git checkout --detach "$ACTUAL_RESULT_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_RESULT_SHA"

      - name: Install pinned CMake
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-pip
          python3 -m pip install --user cmake==3.31.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report CUDA build environment
        run: |
          nvcc --version
          g++ --version
          cmake --version
          echo "CUDA architectures: 70;75;80;86;89;90"

      - name: Configure CUDA targets
        run: |
          cmake -S . -B build-cuda \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="70;75;80;86;89;90" \
            -DCUDA_KERNELS_WERROR=ON

      - name: Compile kernels, GPU test binaries, and benchmark
        run: cmake --build build-cuda --parallel 2

      - name: Verify compile targets exist
        run: |
          test -x build-cuda/tests/test_vecadd
          test -x build-cuda/tests/test_reduce
          test -x build-cuda/tests/test_softmax
          test -x build-cuda/benchmarks/cuda_benchmarks
          echo "CUDA compilation targets were built; no GPU tests were executed."

  # Kernel compilation, correctness and benchmarks. Requires a self-hosted
  # NVIDIA Linux runner labelled as below. Until such a runner is registered,
  # set the repository variable CUDA_CI_ENABLED to anything other than "true"
  # (or leave it unset) so this job is skipped instead of queuing forever.
  #
  # Runner requirements, see docs/hardware.md:
  #   - Linux x86_64, NVIDIA GPU, driver >= 525
  #   - CUDA toolkit 12.x with nvcc on PATH
  #   - labels: self-hosted, linux, x64, nvidia, cuda
  gpu:
    # Never run PR-controlled code on a persistent runner. Only a same-repository
    # PR explicitly authorized by a maintainer may use a one-shot ephemeral runner.
    # Push and workflow_dispatch events are deliberately not eligible.
    if: >-
      vars.CUDA_CI_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'gpu-ci:approved')
    runs-on: [self-hosted, linux, x64, nvidia, cuda, ephemeral]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          clean: true

      - name: Environment report
        run: |
          nvidia-smi
          nvcc --version
          cmake --version

      - name: Build
        run: ./runners/build.sh
        env:
          CMAKE_ARGS: -DCMAKE_BUILD_TYPE=Release

      - name: Correctness tests (GPU)
        run: ./runners/test.sh
        env:
          # This runner exists to validate the kernels, so a skipped GPU test
          # is a failure here rather than a warning.
          GPU_REQUIRED: "1"

      # Compute Sanitizer ships with the CUDA toolkit. Report the installed
      # version explicitly rather than assuming every runner has the same one.
      # Keep instrumentation separate from benchmark timing.
      - name: Report Compute Sanitizer version
        run: compute-sanitizer --version

      - name: Compute Sanitizer (memcheck)
        run: |
          compute-sanitizer --error-exitcode 1 --tool memcheck build/tests/test_vecadd
          compute-sanitizer --error-exitcode 1 --tool memcheck build/tests/test_reduce

      - name: Compute Sanitizer (reduction synchronization)
        run: |
          compute-sanitizer --error-exitcode 1 --tool racecheck build/tests/test_reduce
          compute-sanitizer --error-exitcode 1 --tool synccheck build/tests/test_reduce

      - name: Benchmark
        run: ./runners/benchmark.sh
        env:
          BENCH_ARGS: --iterations 200 --reps 7

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmarks/results/*.json
          if-no-files-found: warn
