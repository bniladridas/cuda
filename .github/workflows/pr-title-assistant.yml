name: PR Title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to process
        required: true
        type: number

concurrency:
  group: "pr-title-assistant-${{ github.event.pull_request.number || inputs.pr }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  suggest-title:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@v7
        with:
          ref: "${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Select and validate the PR title
        env:
          GH_TOKEN: "${{ github.token }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
          PR_NUMBER: "${{ github.event.pull_request.number || inputs.pr }}"
          OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"
          OPENROUTER_MODEL: "${{ vars.CUDA_REVIEW_MODEL }}"
        run: python pr-title/engine/title_assistant.py
