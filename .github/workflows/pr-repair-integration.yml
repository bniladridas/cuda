name: PR repair integration

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR number
        required: true
        type: number
      operation:
        description: Explicit integration mode
        required: true
        type: choice
        options: [rebase, merge]
      expected_head_sha:
        description: Exact approved PR head SHA
        required: true
        type: string
      expected_base_sha:
        description: Exact approved base SHA
        required: true
        type: string
      approval:
        description: Type UPDATE <PR> <HEAD_SHA> <BASE_SHA> <OPERATION>
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-repair-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      branch: ${{ steps.gate.outputs.branch }}
      base_branch: ${{ steps.gate.outputs.base_branch }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      operation: ${{ steps.gate.outputs.operation }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
          OPERATION: ${{ inputs.operation }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          APPROVAL: ${{ inputs.approval }}
          REPAIR_MAINTAINERS: ${{ vars.REPAIR_MAINTAINERS }}
          REPAIR_REBASE_ENABLED: ${{ vars.REPAIR_REBASE_ENABLED }}
          REPAIR_MERGE_ENABLED: ${{ vars.REPAIR_MERGE_ENABLED }}
        run: |
          set -euo pipefail
          python3 rebase-agent/engine/authorization_gate.py > gate.env
          cat gate.env >> "$GITHUB_OUTPUT"

  snapshot:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Export source snapshot and complete diff
        env:
          BASE_BRANCH: ${{ needs.authorize.outputs.base_branch }}
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse "refs/remotes/origin/$BASE_BRANCH")" = "$BASE_SHA"
          git archive --format=tar HEAD > source.tar
          git diff --binary --full-index "$BASE_SHA...$HEAD_SHA" > pr.diff
          git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > pr-files.txt
          test -s pr.diff
          test -s pr-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr-source-snapshot
          path: |
            source.tar
            pr.diff
            pr-files.txt
          if-no-files-found: error
          retention-days: 2

  agent:
    needs: [authorize, snapshot]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pr-source-snapshot
          path: input
      - name: Prepare inert source snapshot
        run: |
          set -euo pipefail
          mkdir source
          python3 - <<'PY'
          import tarfile
          with tarfile.open("input/source.tar") as archive:
              for member in archive.getmembers():
                  if member.name.startswith("/") or ".." in member.name.split("/"):
                      raise SystemExit("unsafe path in source archive")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit("non-regular source archive entry rejected")
              archive.extractall("source")
          PY
          git -C source init -q
          git -C source config user.name "repair-agent"
          git -C source config user.email "repair-agent@users.noreply.github.com"
          git -C source add -A
          git -C source commit -qm "PR source snapshot"
      - name: Inspect live GitHub trees using read-only API access
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request }}
          EXPECTED_HEAD: ${{ needs.authorize.outputs.head_sha }}
          EXPECTED_BASE: ${{ needs.authorize.outputs.base_sha }}
        run: |
          set -euo pipefail
          python3 rebase-agent/engine/tree_inspector.py \
            --repository "$REPOSITORY" --pull-request "$PR_NUMBER" \
            --output tree-inspection.json
          python3 - <<'PY'
          import json, os
          report = json.load(open("tree-inspection.json", encoding="utf-8"))
          if report["head"]["sha"] != os.environ["EXPECTED_HEAD"]:
              raise SystemExit("tree inspection head SHA differs from approved PR head")
          if report["base"]["sha"] != os.environ["EXPECTED_BASE"]:
              raise SystemExit("tree inspection base SHA differs from approved base")
          PY
      - name: Run bounded OpenRouter review and repair proposal
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 rebase-agent/engine/repair_agent.py \
            --source source --diff input/pr.diff --files input/pr-files.txt --report agent-report.json
          git -C source diff --cached --binary --full-index > proposed.patch
          test -s proposed.patch
          python3 - <<'PY'
          import json
          report = json.load(open("agent-report.json", encoding="utf-8"))
          if not report.get("ready_for_validation") or not report.get("patch_applied"):
              raise SystemExit("agent did not produce a patch marked ready for independent validation")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: repair-proposal
          path: |
            proposed.patch
            agent-report.json
            tree-inspection.json
          if-no-files-found: error
          retention-days: 2

  prepare:
    needs: [authorize, agent]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      result_sha: ${{ steps.prepare.outputs.result_sha }}
      result_tree: ${{ steps.prepare.outputs.result_tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: repair-proposal
          path: proposal
      - name: Apply proposed patch, integrate, and validate without secrets
        id: prepare
        env:
          BASE_BRANCH: ${{ needs.authorize.outputs.base_branch }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          OPERATION: ${{ needs.authorize.outputs.operation }}
        run: |
          set -euo pipefail
          git config user.name "cuda-pr-repair"
          git config user.email "cuda-pr-repair@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git apply --check --whitespace=error proposal/proposed.patch
          git apply --whitespace=error proposal/proposed.patch
          git add -A -f
          git commit -m "fix: apply reviewed PR repair proposal"
          git fetch --no-tags origin "refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$BASE_BRANCH")" = "$BASE_SHA"
          if [ "$OPERATION" = rebase ]; then
            git rebase "$BASE_SHA"
          elif [ "$OPERATION" = merge ]; then
            git merge --no-ff --no-edit "$BASE_SHA"
          else
            echo "unsupported operation" >&2
            exit 1
          fi
          python3 -m pip install --disable-pip-version-check --quiet -r requirements-dev.txt
          ruff check .
          ruff format --check .
          python3 -m unittest discover -s rebase-agent/tests
          python3 -m unittest discover -s label-review/tests
          python3 -m unittest discover -s issue-landing/tests
          python3 -m unittest discover -s pr-confidence/tests
          python3 -m unittest discover -s pr-scope-guard/tests
          python3 -m unittest discover -s format-repair/tests
          if [ -d benchmarks/tests ]; then python3 -m unittest discover -s benchmarks/tests; fi
          cmake -S . -B build-cpu -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_CUDAToolkit=ON
          cmake --build build-cpu -j"$(nproc)"
          ctest --test-dir build-cpu --output-on-failure
          git diff --check "$BASE_SHA"...HEAD
          git diff --stat "$BASE_SHA"...HEAD > prepared-diff-stat.txt
          git archive --format=tar HEAD > final-source.tar
          git diff --binary --full-index "$BASE_SHA...HEAD" > final.diff
          git diff --name-only --no-renames -z "$BASE_SHA...HEAD" > final-files.txt
          git rev-parse HEAD > prepared-sha.txt
          git rev-parse HEAD^{tree} > prepared-tree.txt
          python3 rebase-agent/engine/write_validation_report.py validation.json
          git bundle create prepared.bundle HEAD
          echo "result_sha=$(cat prepared-sha.txt)" >> "$GITHUB_OUTPUT"
          echo "result_tree=$(cat prepared-tree.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-integration
          path: |
            prepared.bundle
            prepared-sha.txt
            prepared-tree.txt
            validation.json
            prepared-diff-stat.txt
            final-source.tar
            final.diff
            final-files.txt
          if-no-files-found: error
          retention-days: 2

  final-review:
    needs: [authorize, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: prepared-integration
          path: input
      - name: Prepare inert final source snapshot
        run: |
          set -euo pipefail
          mkdir source
          python3 - <<'PY'
          import tarfile
          with tarfile.open("input/final-source.tar") as archive:
              for member in archive.getmembers():
                  if member.name.startswith("/") or ".." in member.name.split("/"):
                      raise SystemExit("unsafe path in source archive")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit("non-regular source archive entry rejected")
              archive.extractall("source")
          PY
          git -C source init -q
          git -C source config user.name "repair-agent"
          git -C source config user.email "repair-agent@users.noreply.github.com"
          git -C source add -A
          git -C source commit -qm "Final candidate snapshot"
      - name: Review the complete final diff without allowing edits
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 rebase-agent/engine/repair_agent.py \
            --source source --diff input/final.diff \
            --files input/final-files.txt --report final-review.json --review-only
          python3 - <<'PY'
          import json
          report = json.load(open("final-review.json", encoding="utf-8"))
          if not report.get("ready_for_validation"):
              raise SystemExit("final diff review did not approve validation")
          if any(x.get("severity") in {"critical", "high"} for x in report.get("findings", [])):
              raise SystemExit("final review found critical or high severity issues")
          if report.get("patch_applied"):
              raise SystemExit("final review unexpectedly modified the source")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-review
          path: final-review.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [authorize, prepare, final-review]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: prepared-integration
          path: prepared
      - uses: actions/download-artifact@v4
        with:
          name: final-review
          path: review
      - uses: actions/download-artifact@v4
        with:
          name: repair-proposal
          path: proposal
      - name: Verify review, bundle, and exact refs before branch update
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.authorize.outputs.branch }}
          BASE_BRANCH: ${{ needs.authorize.outputs.base_branch }}
          EXPECTED_HEAD: ${{ needs.authorize.outputs.head_sha }}
          EXPECTED_BASE: ${{ needs.authorize.outputs.base_sha }}
          OPERATION: ${{ needs.authorize.outputs.operation }}
          RESULT_SHA: ${{ needs.prepare.outputs.result_sha }}
          RESULT_TREE: ${{ needs.prepare.outputs.result_tree }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          report = json.load(open("review/final-review.json", encoding="utf-8"))
          if not report.get("ready_for_validation") or report.get("patch_applied"):
              raise SystemExit("final review gate failed")
          if any(x.get("severity") in {"critical", "high"} for x in report.get("findings", [])):
              raise SystemExit("final review found critical or high severity issues")
          PY
          git fetch --no-tags origin \
            "refs/heads/$BRANCH:refs/remotes/origin/approved-pr" \
            "refs/heads/$BASE_BRANCH:refs/remotes/origin/approved-base"
          test "$(git rev-parse refs/remotes/origin/approved-pr)" = "$EXPECTED_HEAD"
          test "$(git rev-parse refs/remotes/origin/approved-base)" = "$EXPECTED_BASE"
          git bundle verify prepared/prepared.bundle
          git fetch prepared/prepared.bundle HEAD:refs/repair/prepared
          test "$(git rev-parse refs/repair/prepared)" = "$RESULT_SHA"
          test "$(git rev-parse "refs/repair/prepared^{tree}")" = "$RESULT_TREE"
          if [ "$OPERATION" = rebase ]; then
            git merge-base --is-ancestor "$EXPECTED_BASE" "$RESULT_SHA"
            git fetch --no-tags origin \
              "refs/heads/$BRANCH:refs/remotes/origin/approved-pr" \
              "refs/heads/$BASE_BRANCH:refs/remotes/origin/approved-base"
            test "$(git rev-parse refs/remotes/origin/approved-pr)" = "$EXPECTED_HEAD"
            test "$(git rev-parse refs/remotes/origin/approved-base)" = "$EXPECTED_BASE"
            git push --force-with-lease="refs/heads/$BRANCH:$EXPECTED_HEAD" origin "$RESULT_SHA:refs/heads/$BRANCH"
          elif [ "$OPERATION" = merge ]; then
            read -r commit parent1 parent2 extra < <(git rev-list --parents -n 1 "$RESULT_SHA")
            test "$commit" = "$RESULT_SHA"
            git merge-base --is-ancestor "$EXPECTED_HEAD" "$parent1"
            test "$parent2" = "$EXPECTED_BASE"
            test -z "${extra:-}"
            git fetch --no-tags origin \
              "refs/heads/$BRANCH:refs/remotes/origin/approved-pr" \
              "refs/heads/$BASE_BRANCH:refs/remotes/origin/approved-base"
            test "$(git rev-parse refs/remotes/origin/approved-pr)" = "$EXPECTED_HEAD"
            test "$(git rev-parse refs/remotes/origin/approved-base)" = "$EXPECTED_BASE"
            git push origin "$RESULT_SHA:refs/heads/$BRANCH"
          else
            echo "unsupported operation" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          report = json.load(open("review/final-review.json", encoding="utf-8"))
          audit = {
              "pull_request": int(os.environ["PR_NUMBER"]),
              "actor": os.environ.get("GITHUB_ACTOR"),
              "operation": os.environ["OPERATION"],
              "old_head_sha": os.environ["EXPECTED_HEAD"],
              "new_head_sha": os.environ["RESULT_SHA"],
              "base_sha": os.environ["EXPECTED_BASE"],
              "tree_sha": os.environ["RESULT_TREE"],
              "force_with_lease": os.environ["OPERATION"] == "rebase",
              "initial_agent_review": json.load(open("proposal/agent-report.json", encoding="utf-8")),
              "tree_inspection": json.load(open("proposal/tree-inspection.json", encoding="utf-8")),
              "final_review": report,
              "validation": json.load(open("prepared/validation.json", encoding="utf-8")),
              "diff_stat": open("prepared/prepared-diff-stat.txt", encoding="utf-8").read(),
              "post_update_checks": "pending",
          }
          json.dump(audit, open("audit.json", "w", encoding="utf-8"), indent=2, sort_keys=True)
          PY
      - name: Wait for post-update checks and record conclusions
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_SHA: ${{ needs.prepare.outputs.result_sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            gh api "repos/$GITHUB_REPOSITORY/commits/$RESULT_SHA/check-runs" > checks.json
            if python3 - <<'PY'
          import json, sys
          checks = json.load(open("checks.json", encoding="utf-8")).get("check_runs", [])
          sys.exit(0 if checks and all(item.get("status") == "completed" for item in checks) else 1)
          PY
            then
              break
            fi
            sleep 10
          done
          python3 - <<'PY'
          import json
          checks = json.load(open("checks.json", encoding="utf-8")).get("check_runs", [])
          summary = [
              {"name": x.get("name"), "status": x.get("status"), "conclusion": x.get("conclusion")}
              for x in checks
          ]
          audit = json.load(open("audit.json", encoding="utf-8"))
          audit["post_update_checks"] = summary
          audit["all_checks_completed"] = bool(checks) and all(x["status"] == "completed" for x in checks)
          audit["all_reported_checks_acceptable"] = bool(checks) and all(
              x["conclusion"] in {"success", "skipped", "neutral"} for x in checks
          )
          audit["branch_protection_required_checks_verified"] = False
          json.dump(audit, open("audit.json", "w", encoding="utf-8"), indent=2, sort_keys=True)
          if not audit["all_checks_completed"] or not audit["all_reported_checks_acceptable"]:
              raise SystemExit("post-update checks are pending or failing; inspect audit artifact")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-repair-audit-${{ inputs.pull_request }}
          path: |
            audit.json
            checks.json
          if-no-files-found: warn
          retention-days: 90
