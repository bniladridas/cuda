name: issue-close

# pull_request_target loads this workflow from the base branch. Both jobs that
# execute repository code check out the default branch explicitly.
on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue-number:
        description: Open issue number to report and optionally close after approval
        required: true
        type: number
      approved-report-digest:
        description: Exact SHA-256 from a previously reviewed issue landing report; leave empty for report-only
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: issue-landing-${{ github.event.pull_request.number || inputs.issue-number || github.run_id }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      (
        github.event_name == 'workflow_dispatch'
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      )
      || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate the read-only landing report
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 issue-landing/engine/landing.py report \
              --repo "$GITHUB_REPOSITORY" --issue-number "$ISSUE_NUMBER" --output-dir reports
          else
            python3 issue-landing/engine/landing.py report \
              --repo "$GITHUB_REPOSITORY" --pull-request-number "$PR_NUMBER" --output-dir reports
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: issue-landing-report
          path: reports/
          if-no-files-found: error
          retention-days: 30

  comment:
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: issue-landing-report
          path: reports

      - name: Post auditable reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=0
          for report in reports/issue-*.md; do
            [[ -f "$report" ]] || continue
            issue_number="$(basename "$report" .md | sed 's/^issue-//')"
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$report"
            found=1
          done
          if [[ "$found" == "0" && -f reports/NO_LINKED_ISSUES.md ]]; then
            cat reports/NO_LINKED_ISSUES.md >> "$GITHUB_STEP_SUMMARY"
          fi

  close:
    needs: [report, comment]
    if: >-
      github.event_name == 'workflow_dispatch'
      && vars.ISSUE_LANDING_CLOSE_ENABLED == 'true'
      && inputs.approved-report-digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: issue-landing-close
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: issue-landing-report
          path: reports

      - name: Revalidate the approved report and close the exact issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          APPROVED_DIGEST: ${{ inputs.approved-report-digest }}
        run: |
          python3 issue-landing/engine/landing.py close \
            --repo "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --report "reports/issue-$ISSUE_NUMBER.json" \
            --approved-digest "$APPROVED_DIGEST"
