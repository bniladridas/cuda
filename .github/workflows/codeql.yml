name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a new CodeQL release's queries reach existing code even when
    # nothing is pushed.
    - cron: "27 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # build-mode none infers compilation units from source file
          # extensions, neither compiling nor observing a build, so no CUDA
          # toolkit is installed here. .cu is not one of the extensions CodeQL
          # extracts, so src/vecadd.cu and src/reduce.cu are not analysed.
          build-mode: none

      - name: Analyze - no build step needed with build-mode none
        # Deliberately no "perform autobuild" step: there is nothing to build.
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
