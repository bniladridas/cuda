name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Host-side checks. Runs on every push and PR on a standard GitHub-hosted
  # runner. No CUDA toolkit is installed, so the kernels are not compiled and
  # the GPU kernels are NOT verified here. This job proves the tree configures,
  # the host references are correct, C++ and CUDA sources are formatted, host
  # C++ passes clang-tidy, the CUDA test binaries are absent rather than
  # silently passing, the workflow and repository YAML pass actionlint and
  # yamllint, and the label-review, PR confidence, PR Scope Guard, formatting repair,
  # squash-merge, and rebase safety engines pass their tests.
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint YAML
        run: |
          python3 -m pip install --disable-pip-version-check --quiet yamllint==1.38.0
          git ls-files -co --exclude-standard '*.yml' '*.yaml' | xargs yamllint

      - name: Lint GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: Test the label review engine
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml==6.0.2 jsonschema==4.23.0
          python3 -m unittest discover -s label-review/tests

      - name: Test the issue landing engine
        run: python3 -m unittest discover -s issue-landing/tests

      - name: Test the PR confidence engine
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml==6.0.2
          python3 -m unittest discover -s pr-confidence/tests

      - name: Test the PR Scope Guard engine
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml==6.0.2 jsonschema==4.23.0
          python3 -m unittest discover -s pr-scope-guard/tests

      - name: Test the formatting repair engine
        run: python3 -m unittest discover -s format-repair/tests

      - name: Test the squash-merge policy engine
        run: python3 -m unittest discover -s squash-merge/tests

      - name: Test the safe rebase engine
        run: python3 -m unittest discover -s rebase-agent/tests

      - name: Test the separate merge integration engine
        run: python3 -m unittest discover -s rebase-agent/tests -p 'test_merge_agent.py'

      - name: Test GitHub API tree inspection
        run: python3 -m unittest discover -s rebase-agent/tests -p 'test_tree_inspector.py'

      - name: Test bounded repair agent
        run: python3 -m unittest discover -s rebase-agent/tests -p 'test_repair_agent.py'

      - name: Test runner skip handling
        run: bash tests/test_runner.sh

      - name: Configure (CPU only)
        run: |
          cmake -S . -B build-cpu \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_CUDAToolkit=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build-cpu -j"$(nproc)"

      - name: Test (host reference only)
        run: ctest --test-dir build-cpu --output-on-failure

      - name: Install C++ quality tools
        run: |
          python3 -m pip install --disable-pip-version-check --quiet \
            clang-format==22.1.8 clang-tidy==22.1.8

      - name: Check C++ and CUDA formatting
        run: |
          clang-format --version
          if ! git ls-files '*.cpp' '*.h' '*.cu' '*.cuh' | grep -q .; then
            echo "No C++ or CUDA files found" >&2
            exit 1
          fi
          git ls-files -z '*.cpp' '*.h' '*.cu' '*.cuh' |
            xargs -0 clang-format --dry-run --Werror

      - name: Static analysis (host C++ only)
        run: |
          test -f build-cpu/compile_commands.json
          clang-tidy --version
          clang-tidy --config-file=.clang-tidy --warnings-as-errors='*' \
            -p build-cpu tests/test_host.cpp

      - name: Assert GPU binaries were not built
        run: |
          if [ -e build-cpu/tests/test_vecadd ] || [ -e build-cpu/tests/test_reduce ]; then
            echo "CUDA test binaries exist in a CPU-only build" >&2
            exit 1
          fi
          echo "ok: no CUDA binaries in the CPU-only build"

  # Python quality. Ruff, every Python unittest suite present in the checkout,
  # and coverage. Coverage is reported without a pass threshold. No CUDA
  # toolkit or GPU is required.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Lint Python
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Test Python with coverage
        run: |
          set -euo pipefail
          coverage erase
          ran=0
          for suite in pr-confidence label-review pr-scope-guard format-repair squash-merge rebase-agent benchmarks; do
            if [ ! -d "$suite/tests" ]; then
              echo "Skipping $suite: tests directory not present"
              continue
            fi
            echo "Testing $suite"
            coverage run --append -m unittest discover -s "$suite/tests"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "No Python test suites found" >&2
            exit 1
          fi
          coverage report --show-missing --omit="*/tests/*,*/test_*.py"
          coverage xml -o coverage.xml --omit="*/tests/*,*/test_*.py"

      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: warn

  # Kernel compilation, correctness and benchmarks. Requires a self-hosted
  # NVIDIA Linux runner labelled as below. Until such a runner is registered,
  # set the repository variable CUDA_CI_ENABLED to anything other than "true"
  # (or leave it unset) so this job is skipped instead of queuing forever.
  #
  # Runner requirements, see docs/hardware.md:
  #   - Linux x86_64, NVIDIA GPU, driver >= 525
  #   - CUDA toolkit 12.x with nvcc on PATH
  #   - labels: self-hosted, linux, x64, nvidia, cuda
  gpu:
    if: vars.CUDA_CI_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, nvidia, cuda]
    steps:
      - uses: actions/checkout@v7

      - name: Environment report
        run: |
          nvidia-smi
          nvcc --version
          cmake --version

      - name: Build
        run: ./runners/build.sh
        env:
          CMAKE_ARGS: -DCMAKE_BUILD_TYPE=Release

      - name: Correctness tests (GPU)
        run: ./runners/test.sh
        env:
          # This runner exists to validate the kernels, so a skipped GPU test
          # is a failure here rather than a warning.
          GPU_REQUIRED: "1"

      - name: Benchmark
        run: ./runners/benchmark.sh
        env:
          BENCH_ARGS: --iterations 200 --reps 7

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/*.json
          if-no-files-found: warn
