name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a new CodeQL release's queries reach existing code even when
    # nothing is pushed.
    - cron: "27 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # The kernels need nvcc, which this runner does not have. build-mode
          # none extracts compilation units from source instead of compiling
          # them, so no toolkit is required and none is installed here.
          build-mode: none

      - name: Analyze
        # Deliberately no "perform autobuild" step: there is nothing to build.
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
