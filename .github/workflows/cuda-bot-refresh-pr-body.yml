name: CUDA bot PR body refresh

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cuda-bot-pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create CUDA Actions token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CUDA_ACTIONS_APP_ID }}
          private-key: ${{ secrets.CUDA_ACTIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Check out trusted PR refresh code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate the PR body from the latest diff
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.CUDA_REVIEW_MODEL }}
        run: python3 pr-create/engine/refresh_pr.py
