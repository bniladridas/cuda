name: format-repair

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect
        required: true
        type: number

concurrency:
  group: format-repair-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.action != 'labeled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve pull request number
        id: target
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]] || [[ "$PR_NUMBER" -lt 1 ]]; then
            echo "A positive pull request number is required" >&2
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check out trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned formatter and engine dependency
        run: python -m pip install --disable-pip-version-check --quiet pyyaml==6.0.2 clang-format==22.1.8 ruff==0.17.5

      - name: Inspect changed source files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
          ARTIFACT: ${{ runner.temp }}/format-repair-report.json
        run: |
          python format-repair/engine/format_repair.py report \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --config .github/format-repair.yml \
            --style-file .clang-format --python-config-file pyproject.toml \
            --artifact "$ARTIFACT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload formatting evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: format-repair-report
          path: ${{ runner.temp }}/format-repair-report.json
          if-no-files-found: warn
          retention-days: 30

  repair:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'format-fix:approved'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Validate event metadata
        id: target
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTOR: ${{ github.actor }}
          LABEL: ${{ github.event.label.name }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]] || [[ "$PR_NUMBER" -lt 1 ]]; then
            echo "A positive pull request number is required" >&2
            exit 1
          fi
          if [[ ! "$EVENT_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The event does not contain a valid pull request head SHA" >&2
            exit 1
          fi
          if [[ "$LABEL" != "format-fix:approved" ]]; then
            echo "The required approval label is missing" >&2
            exit 1
          fi
          {
            echo "number=$PR_NUMBER"
            echo "head=$EVENT_HEAD_SHA"
            echo "actor=$ACTOR"
          } >> "$GITHUB_OUTPUT"

      - name: Check out trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: steward
          persist-credentials: false

      - name: Revalidate same-repository head before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
          EVENT_HEAD_SHA: ${{ steps.target.outputs.head }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          HEAD_REPO=$(jq -r '.head.repo.full_name // ""' <<< "$PR_JSON")
          BASE_REPO=$(jq -r '.base.repo.full_name // ""' <<< "$PR_JSON")
          HEAD_SHA=$(jq -r '.head.sha // ""' <<< "$PR_JSON")
          BASE_REF=$(jq -r '.base.ref // ""' <<< "$PR_JSON")
          STATE=$(jq -r '.state // ""' <<< "$PR_JSON")
          HAS_LABEL=$(jq -r 'any(.labels[]?; .name == "format-fix:approved")' <<< "$PR_JSON")
          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" || "$BASE_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "Fork pull requests are report-only; no repair checkout or push is allowed" >&2
            exit 1
          fi
          if [[ "$HEAD_SHA" != "$EVENT_HEAD_SHA" \
            || "$STATE" != "open" \
            || "$BASE_REF" != "$DEFAULT_BRANCH" \
            || "$HAS_LABEL" != "true" ]]; then
            echo "The approved PR state changed or no longer meets the repair policy" >&2
            exit 1
          fi

      - name: Check out the approved PR head as data
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.head }}
          path: work
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned formatter and engine dependency
        run: python -m pip install --disable-pip-version-check --quiet pyyaml==6.0.2 clang-format==22.1.8

      - name: Apply approved formatting-only changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
          EVENT_HEAD_SHA: ${{ steps.target.outputs.head }}
          ACTOR: ${{ steps.target.outputs.actor }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ARTIFACT: ${{ runner.temp }}/format-repair-result.json
        run: |
          python steward/format-repair/engine/format_repair.py repair \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --actor "$ACTOR" \
            --event-head-sha "$EVENT_HEAD_SHA" \
            --default-branch "$DEFAULT_BRANCH" \
            --config steward/.github/format-repair.yml \
            --style-file steward/.clang-format --python-config-file steward/pyproject.toml \
            --workdir work \
            --artifact "$ARTIFACT"

      - name: Dispatch CI for formatter-generated commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
          ARTIFACT: ${{ runner.temp }}/format-repair-result.json
        run: |
          STATUS=$(jq -r '.status' "$ARTIFACT")
          if [[ "$STATUS" != "pushed" ]]; then
            echo "status=not-needed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COMMIT=$(jq -er '.commit_sha' "$ARTIFACT")
          PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          BRANCH=$(jq -er '.head.ref' <<< "$PR_JSON")
          HEAD_SHA=$(jq -er '.head.sha' <<< "$PR_JSON")
          if [[ "$HEAD_SHA" != "$COMMIT" ]]; then
            echo "PR head does not match the formatter commit; refusing to dispatch CI" >&2
            exit 1
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          echo "status=requested" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Remove approval label and acknowledge result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
          ARTIFACT: ${{ runner.temp }}/format-repair-result.json
          ACTOR: ${{ steps.target.outputs.actor }}
          CI_STATUS: ${{ steps.ci.outputs.status }}
          CI_COMMIT: ${{ steps.ci.outputs.commit }}
        run: |
          STATUS=$(jq -r '.status' "$ARTIFACT")
          COMMIT=$(jq -r '.commit_sha // "none"' "$ARTIFACT")
          FILES=$(jq -r '(.changed_files // []) | if length == 0 then "none" else join(", ") end' "$ARTIFACT")
          FORMATTERS=$(jq -r '.formatter_versions // {"clang-format": (.formatter_version // "unknown")} | to_entries | map("\(.key) \(.value)") | join(", ")' "$ARTIFACT")
          VALIDATION=$(jq -r '.validation // "not reported"' "$ARTIFACT")
          CI_RESULT="not needed (no formatting changes)"
          if [[ "$CI_STATUS" == "requested" ]]; then
            CI_RESULT="workflow_dispatch requested for $CI_COMMIT"
          fi
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "format-fix:approved"
          BODY=$(cat <<EOF
          Formatting repair result: $STATUS

          Formatters: $FORMATTERS
          Commit: $COMMIT
          Files: $FILES
          Validation: $VALIDATION
          CI: $CI_RESULT
          Approved by: @$ACTOR

          The normal CI formatter check remains authoritative. This does not
          approve or merge the pull request.
          EOF
          )
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
