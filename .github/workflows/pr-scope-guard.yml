name: pr-scope-guard

# pull_request_target loads this workflow and the engine from the default
# branch, so a pull request cannot alter the code that reads it. The job is
# read-only, checks out no pull request code, and references no secret.
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect
        required: true
        type: number

concurrency:
  group: "pr-scope-guard-${{ github.event.pull_request.number || github.event.inputs.pr_number }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  scope-guard:
    name: PR Scope Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the pull request number
        id: target
        env:
          PR_NUMBER: "${{ github.event.pull_request.number || github.event.inputs.pr_number }}"
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "No numeric pull request number in this event" >&2
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check out the trusted base revision
        uses: actions/checkout@v7
        with:
          ref: "${{ github.event.repository.default_branch }}"
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML and jsonschema
        run: python -m pip install --disable-pip-version-check --quiet pyyaml==6.0.2 jsonschema==4.23.0

      - name: Inspect the pull request scope
        env:
          GH_TOKEN: "${{ github.token }}"
          PR_NUMBER: "${{ steps.target.outputs.number }}"
          ARTIFACT: "${{ runner.temp }}/pr-scope-guard.json"
        run: |
          python pr-scope-guard/engine/scope_guard.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --config .github/pr-scope-guard.yml \
            --registry .github/pr-scopes.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --artifact-out "$ARTIFACT"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-scope-guard-evidence
          path: "${{ runner.temp }}/pr-scope-guard.json"
          if-no-files-found: warn
