name: Rebase PR on approval label

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rebase-approved-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  rebase:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'rebase:approved'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify maintainer authorization and exact PR state
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          jq -e --arg actor "$EVENT_ACTOR" '.maintainers | index($actor) != null' .github/squash-merge.json >/dev/null

          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > pr.json
          jq -e \
            --arg repo "$REPOSITORY" \
            --arg head_sha "$EVENT_HEAD_SHA" \
            --arg head_ref "$EVENT_HEAD_REF" \
            --arg base_sha "$EVENT_BASE_SHA" \
            --arg base_ref "$EVENT_BASE_REF" \
            '.state == "open" and
             .merged == false and
             .draft == false and
             .head.repo.full_name == $repo and
             .base.repo.full_name == $repo and
             .head.sha == $head_sha and
             .head.ref == $head_ref and
             .base.sha == $base_sha and
             .base.ref == $base_ref and
             .base.ref == "main"' pr.json >/dev/null

          test "$EVENT_HEAD_REF" != "main"
          test "$EVENT_HEAD_REF" != "$EVENT_BASE_REF"

          encoded_ref="$(jq -rn --arg ref "$EVENT_HEAD_REF" '$ref | @uri')"
          branch_info="$(gh api "repos/$REPOSITORY/branches/$encoded_ref")"
          jq -e '.protected == false' <<<"$branch_info" >/dev/null

          echo "head_ref=$EVENT_HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "head_sha=$EVENT_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_ref=$EVENT_BASE_REF" >> "$GITHUB_OUTPUT"
          echo "base_sha=$EVENT_BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Rebase onto the exact approved base and update the PR branch
        env:
          GH_TOKEN: ${{ secrets.PR_REBASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ steps.verify.outputs.head_ref }}
          HEAD_SHA: ${{ steps.verify.outputs.head_sha }}
          BASE_REF: ${{ steps.verify.outputs.base_ref }}
          BASE_SHA: ${{ steps.verify.outputs.base_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || {
            echo "Configure PR_REBASE_TOKEN with repository contents write access." >&2
            exit 1
          }
          git config user.name "cuda-pr-rebase"
          git config user.email "cuda-pr-rebase@users.noreply.github.com"
          gh auth setup-git

          git fetch --no-tags origin \
            "refs/heads/$HEAD_REF:refs/remotes/origin/approved-pr" \
            "refs/heads/$BASE_REF:refs/remotes/origin/approved-base"
          test "$(git rev-parse refs/remotes/origin/approved-pr)" = "$HEAD_SHA"
          test "$(git rev-parse refs/remotes/origin/approved-base)" = "$BASE_SHA"

          git checkout --detach refs/remotes/origin/approved-pr
          git rebase "$BASE_SHA"

          # Recheck both live refs and the PR before publishing. Never overwrite
          # a branch that changed after the approval event.
          git fetch --no-tags origin \
            "refs/heads/$HEAD_REF:refs/remotes/origin/approved-pr" \
            "refs/heads/$BASE_REF:refs/remotes/origin/approved-base"
          test "$(git rev-parse refs/remotes/origin/approved-pr)" = "$HEAD_SHA"
          test "$(git rev-parse refs/remotes/origin/approved-base)" = "$BASE_SHA"

          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > pr-before-push.json
          jq -e \
            --arg repo "$REPOSITORY" \
            --arg head_sha "$HEAD_SHA" \
            --arg head_ref "$HEAD_REF" \
            --arg base_sha "$BASE_SHA" \
            --arg base_ref "$BASE_REF" \
            '.state == "open" and .merged == false and .draft == false and
             .head.repo.full_name == $repo and .base.repo.full_name == $repo and
             .head.sha == $head_sha and .head.ref == $head_ref and
             .base.sha == $base_sha and .base.ref == $base_ref' pr-before-push.json >/dev/null

          git push --force-with-lease="refs/heads/$HEAD_REF:$HEAD_SHA" \
            origin "HEAD:refs/heads/$HEAD_REF"

          echo "Rebased PR #$PR_NUMBER onto $BASE_REF ($BASE_SHA)."
          echo "A fresh CI run is expected because the push uses PR_REBASE_TOKEN."
